aid: mosaic-tech
name: Mosaic Tech
description: >-
  Mosaic Tech (Mosaic) was a San Francisco-based Strategic Finance Platform, founded in 2019, that
  connected ERP, CRM, HRIS, billing and data-warehouse systems into a single financial data model for
  FP&A teams — real-time analytics, agile financial planning, cash-flow forecasting, headcount planning
  and multi-entity consolidation. HiBob announced its acquisition of Mosaic on 2025-02-13 and closed it
  on 2025-04-01, folding the product into HiBob's finance/FP&A suite. As of 2026-08-26 the mosaic.tech
  domain 301-redirects every path to hibob.com, app.mosaic.tech redirects to finance-app.hibob.com, and
  api.mosaic.tech answers 503 on every path. Mosaic never published a public developer portal, API
  reference, or machine-readable specification under its own brand — 493 archived mosaic.tech URLs in
  the Internet Archive contain no /api, /docs, /developers, swagger or openapi path. HiBob's own
  developer surface is profiled separately.
